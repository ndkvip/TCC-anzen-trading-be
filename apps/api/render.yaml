services:
  - type: web
    name: anzen-trading-api-demo
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_MIGRATIONS_RUN
        value: "true"
      - key: DATABASE_SYNCHRONIZE
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: ANZEN TRADING Admin
      - key: ADMIN_ORIGIN
        sync: false
      - key: ADMIN_RESET_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: ANZEN TRADING
      - key: AUTH_EXPOSE_OTP
        value: "false"
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_DRIVE_PRIVATE_KEY
        sync: false
      - key: FOREX_FACTORY_SYNC_ENABLED
        value: "true"
      - key: FOREX_FACTORY_SYNC_INTERVAL_MINUTES
        value: "30"
      - key: FOREX_FACTORY_CALENDAR_URL
        value: https://nfs.faireconomy.media/ff_calendar_thisweek.json
