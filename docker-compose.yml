services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ttc_ict
      POSTGRES_USER: ttc_ict
      POSTGRES_PASSWORD: ttc_ict
    ports:
      - "5432:5432"
    volumes:
      - ttc_ict_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttc_ict -d ttc_ict"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ttc_ict_postgres:
